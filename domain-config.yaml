postgres:
  tables:
    tag_types:
      type: application/json;type=tag-type
      columns:
        name: TEXT
        description: TEXT
        archived: BOOLEAN
    taggings:
      type: application/json;type=tagging
      columns:
        tag_id: TEXT
        content_id: TEXT
        active: BOOLEAN
  functions: {}
  scopes:
    tags: SELECT * FROM tag_types
    my-tags: |
      SELECT
        metadata.id as id,
        tag_types.name as name,
        description
      FROM tag_types
      LEFT JOIN metadata
        ON metadata.id = tag_types.id
      WHERE metadata.owner = $REQUESTER
        AND archived IS NOT true
    my-archived-tags: |
      SELECT
        metadata.id as id,
        tag_types.name as name,
        description
      FROM tag_types
      LEFT JOIN metadata
        ON metadata.id = tag_types.id
      WHERE metadata.owner = $REQUESTER
        AND archived IS TRUE
    search: |
      SELECT *
      FROM tag_types
      WHERE to_tsvector('english', name) @@ plainto_tsquery('english', $1)
         OR to_tsvector('english', description) @@ plainto_tsquery('english', $1)
    taggings: |
      SELECT content_id
      FROM taggings
      WHERE tag_id = ANY($1)
        AND active IS TRUE
      GROUP BY content_id
      HAVING COUNT(DISTINCT tag_id) = ARRAY_LENGTH($1, 1)
    tags-for-content: |
      SELECT DISTINCT tag_id
      FROM taggings
      WHERE content_id = $1
        AND active IS TRUE
agent: |
  import Agent from 'npm:@knowlearning/agents/deno.js'
  import * as uuid from "https://deno.land/std@0.207.0/uuid/mod.ts";

  const TAGGING_TYPE = 'application/json;type=tagging'

  const activeUsers = await Agent.state('active-users')

  const logScope = await Agent.state('log')

  if (!logScope.recent) logScope.recent = []

  function log() {
    logScope.recent.push(...arguments)
    while (logScope.recent.length > 100) {
      logScope.recent.shift()
    }
  }

  Agent.on('child', child => {
    const { environment: { user } } = child

    if (!uuid.validate(user)) return

    activeUsers[user] = Date.now()

    child.on('mutate', async mutation => {
      const { scope, patch } = mutation
      activeUsers[user] = Date.now()

      if (scope === 'tags') {
        log('TAG PATCH', patch)
        patch.forEach(async ({ path, value }) => {
          if (path.length === 2) {
            const [ tagId, contentId ] = path
            const taggingId = `tagging/${tagId}/${contentId}`
            const tagging = await Agent.state(taggingId)
            const metadata = await Agent.metadata(taggingId)
            if (metadata.active_type !== TAGGING_TYPE) {
              metadata.active_type = TAGGING_TYPE
            }
            tagging.tag_id = tagId
            tagging.content_id = contentId
            tagging.active = !!value
          }
        })
      }
    })

    child.on('close', info => {
      delete activeUsers[user]
    })
  })
