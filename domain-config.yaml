authorize:
  sameDomain:
    postgres: same_domain_authorization
  crossDomain:
    postgres: cross_domain_authorization
postgres:
  tables:
    tag_types:
      type: application/json;type=tag-type
      columns:
        name: TEXT
        description: TEXT
        archived: BOOLEAN
    taggings:
      type: application/json;type=tagging
      columns:
        tag_id: TEXT
        content_id: TEXT
        active: BOOLEAN
  functions:
    same_domain_authorization:
      returns: BOOLEAN
      language: PLpgSQL
      body: |
        BEGIN
          RETURN TRUE;
        END;
      arguments:
      - name: requestingUser
        type: TEXT
      - name: requestedScope
        type: TEXT
    cross_domain_authorization:
      returns: BOOLEAN
      language: PLpgSQL
      body: |
        BEGIN
          RETURN TRUE;
        END;
      arguments:
      - name: requestingDomain
        type: TEXT
      - name: requestingUser
        type: TEXT
      - name: requestedScope
        type: TEXT
  scopes:
    tags: SELECT * FROM tag_types
    my-tags: |
      SELECT
        metadata.id as id,
        tag_types.name as name,
        description
      FROM tag_types
      LEFT JOIN metadata
        ON metadata.id = tag_types.id
      WHERE metadata.owner = $REQUESTER
        AND archived IS NOT true
    my-archived-tags: |
      SELECT
        metadata.id as id,
        tag_types.name as name,
        description
      FROM tag_types
      LEFT JOIN metadata
        ON metadata.id = tag_types.id
      WHERE metadata.owner = $REQUESTER
        AND archived IS TRUE
    search: |
      SELECT *
      FROM tag_types
      WHERE to_tsvector('english', name) @@ plainto_tsquery('english', $1)
         OR to_tsvector('english', description) @@ plainto_tsquery('english', $1)
    taggings: |
      SELECT content_id
      FROM taggings
      WHERE tag_id = ANY($1)
        AND active IS TRUE
      GROUP BY content_id
      HAVING COUNT(DISTINCT tag_id) = ARRAY_LENGTH($1, 1)
    tags-for-content: |
      SELECT DISTINCT tag_id
      FROM taggings
      WHERE content_id = $1
        AND active IS TRUE
  crossDomainQueries:
    search-tags:
      domains:
      - f74e9cb3-2b53-4c85-9b0c-f1d61b032b3f.localhost:9898
      body: |
        SELECT *
        FROM tag_types
        WHERE to_tsvector('english', name) @@ plainto_tsquery('english', $1)
           OR to_tsvector('english', description) @@ plainto_tsquery('english', $1)
    taggings:
      domains:
      - f74e9cb3-2b53-4c85-9b0c-f1d61b032b3f.localhost:9898
      body: |
        SELECT content_id
        FROM taggings
        WHERE tag_id = ANY($1)
          AND active IS TRUE
        GROUP BY content_id
        HAVING COUNT(DISTINCT tag_id) = ARRAY_LENGTH($1, 1)
    tags-for-content:
      domains:
      - f74e9cb3-2b53-4c85-9b0c-f1d61b032b3f.localhost:9898
      body: |
        SELECT DISTINCT tag_id
        FROM taggings
        WHERE content_id = $1
          AND active IS TRUE
agent: |
  import Agent from 'npm:@knowlearning/agents/deno.js'
  import * as uuid from "https://deno.land/std@0.207.0/uuid/mod.ts";

  const TAGGING_TYPE = 'application/json;type=tagging'

  const activeUsers = await Agent.state('active-users')

  Agent.on('child', child => {
    const { environment: { user } } = child

    activeUsers[user] = Date.now()

    child.on('mutate', async mutation => {
      const { scope, patch } = mutation
      activeUsers[user] = Date.now()

      if (scope === 'tags') {
        Agent.log('TAG PATCH', patch)
        patch.forEach(async ({ path, value }) => {
          if (path.length === 2) {
            const [ tagId, contentId ] = path
            const taggingId = `tagging/${tagId}/${contentId}`
            Agent.log('IN UPDATE LOGIC')
            const tagging = await Agent.state(taggingId)
            Agent.log('GOT STATE', JSON.parse(JSON.stringify(tagging)))
            const metadata = await Agent.metadata(taggingId)
            Agent.log('GOT METADATA', JSON.parse(JSON.stringify(metadata)))
            if (metadata.active_type !== TAGGING_TYPE) {
              metadata.active_type = TAGGING_TYPE
            }
            tagging.tag_id = tagId
            tagging.content_id = contentId
            tagging.active = !!value
            Agent.log('ADJUSTED VALUE', !!value)
          }
        })
      }
    })

    child.on('close', info => {
      delete activeUsers[user]
    })
  })
