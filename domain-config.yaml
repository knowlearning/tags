authorize:
  sameDomain:
    postgres: same_domain_authorization
  crossDomain:
    postgres: cross_domain_authorization
postgres:
  tables:
    tag_types:
      type: application/json;type=tag-type
      columns:
        name: TEXT
        description: TEXT
        archived: BOOLEAN
    taggings:
      type: application/json;type=tagging
      columns:
        tag: TEXT
        target: TEXT
        partition: TEXT
        contributor: TEXT
        context: TEXT[]
        value: JSON
  functions:
    same_domain_authorization:
      returns: BOOLEAN
      language: PLpgSQL
      body: |
        BEGIN
          RETURN TRUE;
        END;
      arguments:
      - name: requestingUser
        type: TEXT
      - name: requestedScope
        type: TEXT
    cross_domain_authorization:
      returns: BOOLEAN
      language: PLpgSQL
      body: |
        BEGIN
          RETURN TRUE;
        END;
      arguments:
      - name: requestingDomain
        type: TEXT
      - name: requestingUser
        type: TEXT
      - name: requestedScope
        type: TEXT
  queries:
    search-tags:
      domains:
      - f74e9cb3-2b53-4c85-9b0c-f1d61b032b3f.localhost:9898
      - c0f3a481-d4d5-4133-a198-94a325aa4536.localhost:6061
      - create.pilaproject.org
      - thailand.pilaproject.org
      - polska-rct-2025.pilaproject.org
      - france-rct-2025.pilaproject.org
      - cambodia.pilaproject.org
      - app.pilaproject.org
      - embed.knowlearning.systems
      body: |
        SELECT *
        FROM tag_types
        WHERE to_tsvector('english', name) @@ plainto_tsquery('english', $1)
           OR to_tsvector('english', description) @@ plainto_tsquery('english', $1)
    taggings-intersection:
      domains:
      - f74e9cb3-2b53-4c85-9b0c-f1d61b032b3f.localhost:9898
      - c0f3a481-d4d5-4133-a198-94a325aa4536.localhost:6061
      - create.pilaproject.org
      - thailand.pilaproject.org
      - polska-rct-2025.pilaproject.org
      - france-rct-2025.pilaproject.org
      - cambodia.pilaproject.org
      - app.pilaproject.org
      - embed.knowlearning.systems
      body: |
        SELECT
          target
        FROM taggings
        WHERE partition = $1
          AND tag = ANY($2)
          AND value IS NOT NULL
        GROUP BY target, partition
        HAVING COUNT(DISTINCT tag) = ARRAY_LENGTH($2, 1)
    taggings-for-tag:
      domains:
      - f74e9cb3-2b53-4c85-9b0c-f1d61b032b3f.localhost:9898
      - c0f3a481-d4d5-4133-a198-94a325aa4536.localhost:6061
      - create.pilaproject.org
      - thailand.pilaproject.org
      - polska-rct-2025.pilaproject.org
      - france-rct-2025.pilaproject.org
      - cambodia.pilaproject.org
      - app.pilaproject.org
      - embed.knowlearning.systems
      body: |
        SELECT
          id AS tagging,
          target,
          contributor,
          value
        FROM taggings
        WHERE partition = $1
          AND tag = $2
          AND value IS NOT NULL
    taggings-for-tag-in-context:
      domains:
      - f74e9cb3-2b53-4c85-9b0c-f1d61b032b3f.localhost:9896
      body: |
        SELECT
          id AS tagging,
          target,
          contributor,
          value
        FROM taggings
        WHERE partition = $1
          AND tag = $2
          AND context = $3::text[]
          AND value IS NOT NULL
    taggings-targeting-tags:
      domains:
      - f74e9cb3-2b53-4c85-9b0c-f1d61b032b3f.localhost:9898
      - c0f3a481-d4d5-4133-a198-94a325aa4536.localhost:6061
      - create.pilaproject.org
      - thailand.pilaproject.org
      - polska-rct-2025.pilaproject.org
      - france-rct-2025.pilaproject.org
      - cambodia.pilaproject.org
      - app.pilaproject.org
      - embed.knowlearning.systems
      body: |
        SELECT
          taggings.id AS tagging,
          target,
          contributor,
          value
        FROM taggings
        JOIN metadata ON metadata.id = taggings.target
        WHERE partition = $1
          AND tag = $2
          AND value IS NOT NULL
          AND metadata.active_type = 'application/json;type=tag-type'
    top-level-tags: |
      WITH RECURSIVE roots AS (
          -- Identify root tags that are not targeted by any other tags
          SELECT id
          FROM tag_types
          WHERE NOT EXISTS (
              SELECT 1
              FROM taggings
              WHERE tag_types.id = target
                AND taggings.partition = $1
                AND taggings.target != taggings.tag
                AND taggings.value IS NOT NULL
          ) AND EXISTS (
              SELECT 1
              FROM taggings
              WHERE tag_types.id = tag
                AND taggings.partition = $1
                AND taggings.value IS NOT NULL
          )
      ),
      traversal AS (
          -- Begin traversal from root tags to follow tag-target relationships
          SELECT tag, target, ARRAY[tag] AS path, ARRAY[target] AS reached, false AS is_cycle
          FROM taggings
          WHERE tag IN (SELECT id FROM roots)

          UNION ALL

          -- Continue traversal, tracking paths and reached tags to detect cycles
          SELECT t.tag, t.target, tt.path || t.tag, tt.reached || t.target, t.tag = ANY(tt.path) OR tt.is_cycle
          FROM traversal tt
          JOIN taggings t ON tt.target = t.tag
          WHERE NOT tt.is_cycle -- Stop recursion when a cycle is detected to avoid infinite loops
            AND t.partition = $1
            AND t.value IS NOT NULL
      ),
      isolated_cycles AS (
          -- Determine isolated cycles not reachable from any root
          SELECT tag, MIN(tag) OVER (PARTITION BY array_to_string(path, ',')) AS representative
          FROM traversal
          WHERE is_cycle
          AND tag NOT IN (SELECT DISTINCT UNNEST(reached) FROM traversal)
      )

      -- Select all root tags and unique representatives from isolated cycles
      SELECT id AS tag
      FROM roots

      UNION

      SELECT DISTINCT representative
      FROM isolated_cycles
    tagging-contributor: |
      SELECT contributor
      FROM taggings
      WHERE partition = $1
        AND tag = $2
        AND target = $3
    tagging-for-target:
      domains:
      - f74e9cb3-2b53-4c85-9b0c-f1d61b032b3f.localhost:9898
      - c0f3a481-d4d5-4133-a198-94a325aa4536.localhost:6061
      - create.pilaproject.org
      - thailand.pilaproject.org
      - polska-rct-2025.pilaproject.org
      - france-rct-2025.pilaproject.org
      - cambodia.pilaproject.org
      - app.pilaproject.org
      - embed.knowlearning.systems
      body: |
        SELECT value
        FROM taggings
        WHERE partition = $1
          AND tag = $2
          AND target = $3
          AND value IS NOT NULL
    taggings-for-target:
      domains:
      - f74e9cb3-2b53-4c85-9b0c-f1d61b032b3f.localhost:9898
      - c0f3a481-d4d5-4133-a198-94a325aa4536.localhost:6061
      - create.pilaproject.org
      - thailand.pilaproject.org
      - polska-rct-2025.pilaproject.org
      - france-rct-2025.pilaproject.org
      - cambodia.pilaproject.org
      - app.pilaproject.org
      - embed.knowlearning.systems
      body: |
        SELECT
          tag,
          value
        FROM taggings
        WHERE partition = $1
          AND target = $2
          AND value IS NOT NULL
    tag-ancestor-paths:
      domains:
      - f74e9cb3-2b53-4c85-9b0c-f1d61b032b3f.localhost:9898
      - c0f3a481-d4d5-4133-a198-94a325aa4536.localhost:6061
      - create.pilaproject.org
      - thailand.pilaproject.org
      - polska-rct-2025.pilaproject.org
      - france-rct-2025.pilaproject.org
      - cambodia.pilaproject.org
      - app.pilaproject.org
      - embed.knowlearning.systems
      body: |
        WITH RECURSIVE AncestorPaths AS (
            -- Anchor member: Initialize with each direct ancestor of the given child
            SELECT
                target AS child,
                tag AS ancestor,
                ARRAY[tag]::VARCHAR[] AS path  -- Starts the path with the ancestor
            FROM taggings
            WHERE partition = $1
              AND target = $2
              AND value IS NOT NULL

            UNION ALL

            -- Recursive member: Extend the path by prepending the next ancestor
            SELECT
                ap.child,
                t.tag,
                t.tag || ap.path  -- Prepends the new ancestor to the current path
            FROM taggings t
            INNER JOIN AncestorPaths ap ON t.target = ap.ancestor
            WHERE partition = $1
              AND value IS NOT NULL
              AND NOT t.tag = ANY(ap.path)  -- Prevent cycling by not revisiting any ancestors in the path
        ),
        LongestPaths AS (
            SELECT
                child,
                ancestor,
                path,
                array_length(path, 1) AS length,
                first_value(ancestor) OVER (PARTITION BY child ORDER BY array_length(path, 1) DESC) AS root_ancestor
            FROM AncestorPaths
        )
        SELECT
            path
        FROM LongestPaths
        WHERE root_ancestor = ancestor  -- Ensures this path is the longest starting from its root ancestor
          AND child = $2
        ORDER BY length DESC, path
    my-descendent-taggings-for-tag:
      domains:
      - f74e9cb3-2b53-4c85-9b0c-f1d61b032b3f.localhost:9898
      - c0f3a481-d4d5-4133-a198-94a325aa4536.localhost:6061
      - create.pilaproject.org
      - thailand.pilaproject.org
      - polska-rct-2025.pilaproject.org
      - france-rct-2025.pilaproject.org
      - cambodia.pilaproject.org
      - app.pilaproject.org
      - embed.knowlearning.systems
      body: |
        WITH RECURSIVE TagHierarchy AS (
          -- Base case: find all taggings where you are the contributor
          SELECT
              target AS initial_target,
              target AS descendent_target,
              taggings.id AS tagging,
              value,
              contributor,
              ARRAY[target] AS path
          FROM taggings
          LEFT JOIN metadata ON metadata.id = taggings.id
          WHERE contributor = $REQUESTER
            AND partition = $1
            AND tag = $2
            AND value IS NOT NULL
            AND owner = 'tags.knowlearning.systems'

          UNION ALL

          -- Recursive case: find all targets tagged by the current target
          SELECT
              th.initial_target,
              t.target AS descendent_target,
              t.id AS tagging,
              t.value AS value,
              t.contributor,
              th.path || t.target
          FROM
              TagHierarchy th
          JOIN taggings t ON th.descendent_target = t.contributor
          JOIN metadata ON metadata.id = t.id
          WHERE  t.target <> ALL(th.path)  -- Prevent loops by checking if the target is already in the path
            AND t.partition = $1
            AND t.tag = $2
            AND t.value IS NOT NULL
            AND owner = 'tags.knowlearning.systems'
        )
        SELECT
            value,
            tagging,
            contributor,
            descendent_target as target
        FROM
            TagHierarchy
agent: |
  import Agent, { getAgent } from 'npm:@knowlearning/agents/deno.js'
  import * as uuid from "https://deno.land/std@0.207.0/uuid/mod.ts";

  // TRANSLATION AGENT STUFF
  // const TRANSLATION_DOMAIN = 'f74e9cb3-2b53-4c85-9b0c-f1d61b032b3f.localhost:5889'
  const TRANSLATION_DOMAIN = 'translations.pilaproject.org'
  const TRANSLATABLE_TARGET_TYPE = 'application/json;type=translatable_target'

  const TranslationAgent = getAgent(TRANSLATION_DOMAIN)

  Agent.on('child', child => {
    child.on('mutate', async ({ id }) => {
      if (await isTranslatableItem(id)) {
        await handleTranslatableItem(id)
      }
    })
  })

  async function handleTranslatableItem(id) {
    const itemState = await TranslationAgent.state(id)
    const itemMetadata = await TranslationAgent.metadata(id)
    itemState.translations.paths.forEach(async path => {
      const translatableTargetName = `translatable_target/${JSON.stringify([id, ...path])}`
      const translatableTargetMetadata = await TranslationAgent.metadata(translatableTargetName)

      if (translatableTargetMetadata.active_type !== TRANSLATABLE_TARGET_TYPE) {
        translatableTargetMetadata.active_type = TRANSLATABLE_TARGET_TYPE
      }

      const translatableTarget = await TranslationAgent.state(translatableTargetName)
      const source_string = resolvePath([...path], itemState)

      translatableTarget.source_language = itemState.translations.source_language
      translatableTarget.source_string = source_string || null
      translatableTarget.path = [id, ...path]
      translatableTarget.ii = itemMetadata.ii
    })
  }

  function resolvePath(path, value) {
      while (path.length && value) value = value[path.shift()]
      return value
    }

  async function isTranslatableItem(id) {
    const state = await Agent.state(id)
    const translations = state.translations

    if (!translations) return false
    const { source_language, paths } = translations
    if (!source_language) return false
    if (!paths) return false
  
    const validSourceLang = typeof source_language === 'string' && source_language.length >= 2
    const validPaths = Array.isArray(paths) && paths.every(p => Array.isArray(p))
    return validSourceLang && validPaths
  }
  // END TRANSLATION AGENT STUFF


  const TAGGING_TYPE = 'application/json;type=tagging'

  const PILA_INTERNATIONAL_PARTITION = 'PILA'
  const PILA_THAILAND_PARTITION = 'PILA Thailand'
  const PILA_CAMBODIA_PARTITION = 'PILA Cambodia'
  const PILA_POLAND_RCT_PARTITION = 'PILA Poland RCT 2025'
  const PILA_FRANCE_RCT_PARTITION = 'PILA France RCT 2025'
  const PUBLIC_TAGS_PARTITION = 'Public Tags'

  const ADMIN_TAG = "36e1b060-ed49-11ee-be89-5b04faf266ea"
  const TEACHER_TAG = "49bf66a0-ed49-11ee-be89-5b04faf266ea"
  const TRAINER_TAG = "8ae541e0-ed49-11ee-be89-5b04faf266ea"
  const THAI_TEACHER_LABEL = "bc66acf0-7249-11f0-a043-df27bf1150f5"
  const PILA_CONTENT_TAG = "1a53db50-e248-11ee-ab5f-07f4a7408770"
  const PILA_COMPETENCY_TAG = "f760dad0-f133-11ee-804e-27f76a81958c"

  Agent.on('child', child => {
    const { environment: { user } } = child

    child.on('mutate', async mutation => {
      const { scope, patch } = mutation

      if (scope === 'tags') {
        Agent.log('GOT TAGGING PATCH', patch)
        patch.forEach(async ({ path, value: patchValue={} }) => {
          if (path.length === 2) {
            const [ tag, target ] = path
            const { partition=user, context=null, value=null } = patchValue || {}
            let contributor = user

            // The only agents able to overwrite contributor are trusted domains
            if (isTrustedDomain(user)) contributor = patchValue.contributor || user

            const apply = () => applyTagging(partition, tag, target, contributor, value, context)
            const reject = () => Agent.log(`User tagging rejected`, partition, user, contributor, tag)

            if (partition === contributor) apply()
            else if (partition === PUBLIC_TAGS_PARTITION) apply()
            else if (isPILAPartition(partition)) {
              if (isSuperAdmin(partition, contributor)) apply()
              else if (tag === PILA_CONTENT_TAG || tag === THAI_TEACHER_LABEL) {
                if (await isAdmin(partition, contributor)) apply()
                else reject()
              }
              else if (tag === TRAINER_TAG || tag === TEACHER_TAG) {
                if (await isTrainer(partition, contributor)) apply()
                else reject()
              }
              else if (await hasTag(partition, PILA_COMPETENCY_TAG, tag)) {
                if (await isAdmin(partition, contributor)) apply()
                else reject()
              }
              else reject()
            }
            else reject()
          }
        })
      }
    })
  })

  function isTrustedDomain(domain) {
    return [
      'app.pilaproject.org',
      'thailand.pilaproject.org',
      'polska-rct-2025.pilaproject.org',
      'france-rct-2025.pilaproject.org',
      'cambodia.pilaproject.org',
      'create.pilaproject.org',
      'tags.knowlearning.systems',
      'f74e9cb3-2b53-4c85-9b0c-f1d61b032b3f.localhost:9896',
      'f74e9cb3-2b53-4c85-9b0c-f1d61b032b3f.localhost:9898',
      'c0f3a481-d4d5-4133-a198-94a325aa4536.localhost:9898',
      '0c9c64fc-559e-40d4-916b-852f6d108a17.localhost:9898',
      'c0f3a481-d4d5-4133-a198-94a325aa4536.localhost:6061',
      '0c9c64fc-559e-40d4-916b-852f6d108a17.localhost:6061'
    ].includes(domain)
  }

  function isPILAPartition(partition) {
    return [
      PILA_INTERNATIONAL_PARTITION,
      PILA_THAILAND_PARTITION,
      PILA_POLAND_RCT_PARTITION,
      PILA_FRANCE_RCT_PARTITION,
      PILA_CAMBODIA_PARTITION
    ].includes(partition)
  }

  function isSuperAdmin(partition, user) {
    if (isPILAPartition(partition)) {
      return [
        "f74e9cb3-2b53-4c85-9b0c-f1d61b032b3f",
        "c0f3a481-d4d5-4133-a198-94a325aa4536",
        "0c9c64fc-559e-40d4-916b-852f6d108a17", // OLD MATT
        "aabc6c9c-a4f8-405b-9de3-76588997d52f"  // EDU PILA
      ].includes(user)
    }
    else return false
  }

  async function isAdmin(partition, user) {
    return (
      isSuperAdmin(partition, user) ||
      await hasTag(partition, ADMIN_TAG, user)
    )
  }

  async function isTrainer(partition, user) {
    return (
      await isAdmin(partition, user) ||
      await hasTag(partition, TRAINER_TAG, user)
    )
  }

  async function hasTag(partition, tag, user) {
    const tagging = await Agent.query('tagging-for-target', [partition, tag, user])
    return !!tagging?.[0]
  }

  async function applyTagging(partition, tag, target, contributor, value, context) {
    const taggingPathParts = [partition, tag, target]
    if (context) taggingPathParts.push(context)
    const id = `tagging/${JSON.stringify(taggingPathParts)}`
    const tagging = await Agent.state(id)
    const md = await Agent.metadata(id)

    if (md.active_type !== TAGGING_TYPE) md.active_type = TAGGING_TYPE

    //  TODO: consider making 'authority' the agent that specified contributor
    const taggingData = {
      tag,
      target,
      contributor,
      partition,
      value,
      context
    }

    Object.assign(tagging, taggingData)
  }